<body class="bg-pitch text-white font-inter selection:bg-neonCyan selection:text-pitch overflow-x-hidden antialiased cinema-grid-bg relative w-full max-w-full">

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Audio Ambient Synth (Synthesizes deep cinematic atmospheric drone) ---
    class CinematicAudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.filter = null;
        this.gain = null;
        this.isPlaying = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      start() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const now = this.ctx.currentTime;
        this.gain = this.ctx.createGain();
        this.gain.gain.setValueAtTime(0.001, now);
        this.gain.gain.exponentialRampToValueAtTime(0.12, now + 3);

        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(140, now);

        // Low drone oscillators in perfect fifth (D1 and A1)
        this.osc1 = this.ctx.createOscillator();
        this.osc1.type = 'sawtooth';
        this.osc1.frequency.setValueAtTime(36.71, now); // D1

        this.osc2 = this.ctx.createOscillator();
        this.osc2.type = 'sine';
        this.osc2.frequency.setValueAtTime(55.00, now); // A1

        // Subtle LFO for breathing filter
        this.lfo = this.ctx.createOscillator();
        this.lfo.frequency.setValueAtTime(0.15, now);
        this.lfoGain = this.ctx.createGain();
        this.lfoGain.gain.setValueAtTime(60, now);
        this.lfo.connect(this.lfoGain);
        this.lfoGain.connect(this.filter.frequency);

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc1.start(now);
        this.osc2.start(now);
        this.lfo.start(now);
        this.isPlaying = true;
      }

      stop() {
        if (!this.isPlaying || !this.gain || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);
        setTimeout(() => {
          try {
            if (this.osc1) this.osc1.stop();
            if (this.osc2) this.osc2.stop();
            if (this.lfo) this.lfo.stop();
          } catch (e) {}
          this.isPlaying = false;
        }, 1600);
      }

      toggle() {
        if (this.isPlaying) {
          this.stop();
          return false;
        } else {
          this.start();
          return true;
        }
      }
    }

    const audioEngine = new CinematicAudioEngine();

    // ==========================================
    // COMPONENT: Custom Cinema Cursor Reticle
    // ==========================================
    function CustomCursor() {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [hovered, setHovered] = useState(false);
      const [hoverText, setHoverText] = useState('');
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setPos({ x: e.clientX, y: e.clientY });
          if (!visible) setVisible(true);
        };

        const handleMouseLeave = () => setVisible(false);

        const handleMouseOver = (e) => {
          const target = e.target.closest('[data-cursor]');
          if (target) {
            setHovered(true);
            setHoverText(target.getAttribute('data-cursor') || '');
          } else {
            const clickable = e.target.closest('a, button, input, textarea, select, [role="button"]');
            setHovered(!!clickable);
            setHoverText('');
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);
        document.addEventListener('mouseover', handleMouseOver);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          document.removeEventListener('mouseover', handleMouseOver);
        };
      }, [visible]);

      if (!visible) return null;

      return (
        <div 
          className="pointer-events-none fixed z-50 transition-transform duration-75 ease-out hidden md:block"
          style={{
            transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
            left: 0,
            top: 0
          }}
        >
          {/* Main Reticle Center Dot */}
          <div className={`-translate-x-1/2 -translate-y-1/2 rounded-full transition-all duration-200 flex items-center justify-center ${
            hovered 
              ? 'w-12 h-12 bg-neonCyan/15 border border-neonCyan backdrop-blur-sm' 
              : 'w-4 h-4 bg-neonCyan/40 border border-neonCyan/80'
          }`}>
            <div className="w-1.5 h-1.5 rounded-full bg-neonCyan"></div>
            {hoverText && (
              <span className="absolute -bottom-6 text-[9px] font-mono tracking-widest text-neonCyan uppercase font-bold whitespace-nowrap bg-black/80 px-1.5 py-0.5 rounded border border-neonCyan/40">
                {hoverText}
              </span>
            )}
          </div>
          {/* Subtle Outer Corner Crosshairs */}
          <div className={`absolute -translate-x-1/2 -translate-y-1/2 w-8 h-8 pointer-events-none transition-opacity duration-300 ${
            hovered ? 'opacity-90 scale-125' : 'opacity-40'
          }`}>
            <span className="absolute top-0 left-0 w-2 h-[1px] bg-neonCyan"></span>
            <span className="absolute top-0 left-0 h-2 w-[1px] bg-neonCyan"></span>
            <span className="absolute top-0 right-0 w-2 h-[1px] bg-neonCyan"></span>
            <span className="absolute top-0 right-0 h-2 w-[1px] bg-neonCyan"></span>
            <span className="absolute bottom-0 left-0 w-2 h-[1px] bg-neonCyan"></span>
            <span className="absolute bottom-0 left-0 h-2 w-[1px] bg-neonCyan"></span>
            <span className="absolute bottom-0 right-0 w-2 h-[1px] bg-neonCyan"></span>
            <span className="absolute bottom-0 right-0 h-2 w-[1px] bg-neonCyan"></span>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: Navigation & Header
    // ==========================================
    function Header({ onOpenContact, onToggleLetterbox, letterboxActive, audioPlaying, onToggleAudio }) {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [timecode, setTimecode] = useState("00:00:06:35");

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 40);
        };
        window.addEventListener('scroll', handleScroll);

        // Frame-accurate ticking timecode
        let frame = 35;
        let sec = 6;
        let min = 0;
        const interval = setInterval(() => {
          frame++;
          if (frame >= 24) {
            frame = 0;
            sec++;
            if (sec >= 60) {
              sec = 0;
              min++;
            }
          }
          const fStr = frame.toString().padStart(2, '0');
          const sStr = sec.toString().padStart(2, '0');
          const mStr = min.toString().padStart(2, '0');
          setTimecode(`00:${mStr}:${sStr}:${fStr}`);
        }, 1000 / 24);

        return () => {
          window.removeEventListener('scroll', handleScroll);
          clearInterval(interval);
        };
      }, []);

      return (
        <header className={`fixed top-0 left-0 right-0 z-40 transition-all duration-500 ${
          isScrolled 
            ? 'bg-pitch/85 backdrop-blur-md border-b border-borderDark py-3 shadow-2xl'

                    <div className="w-1.5 h-1.5 rounded-full bg-neonCyan"></div>
                    <span className="absolute -top-1 -right-1 w-1 h-1 bg-recRed rounded-full animate-rec-blink"></span>
                  </div>
                  {/* Subtle corner ticks */}
                  <span className="absolute top-0.5 left-0.5 text-[7px] font-mono text-neonCyan/50 leading-none">┌</span>
                  <span className="absolute bottom-0.5 right-0.5 text-[7px] font-mono text-neonCyan/50 leading-none">┘</span>
                </div>

                <div className="flex flex-col">
                  <div className="flex items-center gap-1.5">
                    <span className="font-syne font-extrabold text-xl tracking-tight text-white group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-white group-hover:via-neonCyan group-hover:to-white transition-all">
                      Framemotion
                    </span>
                    <span className="w-1.5 h-1.5 rounded-full bg-neonCyan animate-pulse"></span>
                  </div>
                  <span className="font-mono text-[9px] uppercase tracking-[0.28em] text-white/40 -mt-1 hidden sm:block">
                    Cinematic Studio
                  </span>
                </div>
              </a>

              {/* Center: Navigation Links */}
              <nav className="hidden md:flex items-center space-x-1 lg:space-x-2 bg-surface/40 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/5">
                {[
                  { name: 'Work', href: '#work' },
                  { name: 'Scenic', href: '#scenic' },
                  { name: 'Services', href: '#services' },
                  { name: 'Process', href: '#process' },
                  { name: 'Journal', href: '#journal' },
                  { name: 'Contact', href: '#contact' },
                ].map((item) => (
                  <a
                    key={item.name}
                    href={item.href}
                    data-cursor="NAV"
                    className="px-3.5 py-1 text-xs font-medium tracking-wider text-white/70 hover:text-white hover:text-neonCyan transition-colors rounded-full hover:bg-white/5"
                  >
                    [{item.name}]
                  </a>
                ))}
              </nav>

              {/* Right: Actions & Button */}
              <div className="flex items-center gap-3">
                
                {/* Audio Ambience Toggle */}
                <button
                  onClick={onToggleAudio}
                  title={audioPlaying ? "Mute Cinematic Ambience" : "Play Cinematic Ambience"}
                  className={`hidden sm:flex items-center gap-2 px-2.5 py-1.5 rounded-full text-[10px] font-mono tracking-wider border transition-all ${
                    audioPlaying 
                      ? 'border-neonCyan bg-neonCyan/10 text-neonCyan shadow-[0_0_12px_rgba(0,242,254,0.3)]' 
                      : 'border-white/10 text-white/50 hover:text-white hover:border-white/30'

                  data-cursor="SOUND"

                    <span className={`w-0.5 bg-current rounded-full transition-all ${audioPlaying ? 'h-2 animate-pulse' : 'h-1.5'}`}></span>

                {/* Scope / Aspect Ratio Letterbox Toggle */}
                <button

                    letterboxActive 
                      ? 'border-electricPurple bg-electricPurple/15 text-white' 
                      : 'border-white/10 text-white/40 hover:text-white'
                  }`}
                  data-cursor="SCOPE"
                >
                  <span>2.39:1</span>

                {/* Primary CTA: "Get in Touch" with glowing neon border */}
                <button

                  data-cursor="CLICK"
                  className="relative group overflow-hidden rounded-full p-[1px] focus:outline-none"

                  <span className="absolute inset-0 bg-gradient-to-r from-neonCyan via-electricPurple to-neonCyan rounded-full opacity-70 group-hover:opacity-100 blur-[2px] transition-opacity duration-300"></span>
                  <span className="relative flex items-center gap-2 px-4 sm:px-5 py-2 rounded-full bg-pitch transition-all duration-300 group-hover:bg-pitch/80 text-xs sm:text-sm font-medium tracking-wide text-white group-hover:text-neonCyan">
                    <span>Get in Touch</span>
                    <svg className="w-3.5 h-3.5 transform transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                  </span>
                </button>

                {/* Mobile Menu Hamburger */}
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-2 text-white/70 hover:text-white focus:outline-none"
                  aria-label="Toggle Menu"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {mobileMenuOpen ? (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                    ) : (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"/>
                    )}
                  </svg>
                </button>
              </div>
            </div>

            {/* Bottom line of Header: Minimal timeline / timecode labels */}

                  <span>TC: {timecode}</span>
                </span>
                <span className="text-white/20">|</span>
                <span>FPS: 24.000</span>
                <span className="hidden md:inline text-white/20">|</span>
                <span className="hidden md:inline">SHUTTER: 1/48</span>
                <span className="hidden md:inline text-white/20">|</span>
                <span className="hidden md:inline">ISO: 800</span>
              </div>

                <span className="hidden lg:inline text-white/20">|</span>
                <span>RANGE: 00:00:06:35 — 00:09:33:38</span>
              </div>
            </div>
          </div>

          {/* Mobile Navigation Dropdown */}
          {mobileMenuOpen && (
            <div className="md:hidden bg-pitch/95 border-b border-white/10 px-6 py-6 space-y-4 backdrop-blur-xl animate-fadeIn">
              <div className="flex flex-col space-y-3 font-syne text-lg">
                {[
                  { name: 'Selected Work', href: '#work' },
                  { name: 'Scenic & Landscapes', href: '#scenic' },
                  { name: 'Services & Direction', href: '#services' },
                  { name: 'Our Process', href: '#process' },
                  { name: 'Journal', href: '#journal' },

              <div className="pt-2 flex items-center justify-between text-xs font-mono text-white/50">
                <button

                  className="flex items-center gap-2 text-neonCyan"

                  <span>{audioPlaying ? '● SOUND PLAYING' : '○ AMBIENT SOUND'}</span>

                <span>TC {timecode}</span>

    }

    function Hero({ onOpenReel, onScrollToWork }) {
      return (
        <section className="relative min-h-screen w-full flex items-center justify-center overflow-hidden pt-20 pb-16">
          
          {/* Full-Screen Video Background with Fallback Poster */}
          <div className="absolute inset-0 w-full h-full z-0 overflow-hidden">
            <video

              loop

              playsInline
              poster="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85"
              className="w-full h-full object-cover object-center scale-105 filter brightness-75 contrast-110 saturate-[0.85] transition-transform duration-[10000ms] ease-out hover:scale-100"

              {/* Fallback to high quality atmospheric mist/mountain MP4 */}
              <source src="https://assets.mixkit.co/videos/preview/mixkit-fog-over-the-mountain-peaks-42998-large.mp4" type="video/mp4" />
              <source src="https://cdn.coverr.co/videos/coverr-mist-in-the-mountains-2746/1080p.mp4" type="video/mp4" />
            </video>

            {/* Dark Cinematic Gradients for Readability */}

      );
    }

    // ==========================================
    // COMPONENT: Showreel Modal (Full Screen Video Reel)
    // ==========================================
    function ShowreelModal({ isOpen, onClose }) {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 sm:p-8 animate-fadeIn">
          {/* Close Button */}
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/60 hover:text-white p-2 rounded-full bg-white/10 hover:bg-white/20 transition-all"
            data-cursor="CLOSE"
          >
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          {/* Modal Card */}
          <div className="relative w-full max-w-5xl aspect-video bg-pitch rounded-2xl overflow-hidden border border-white/20 shadow-[0_0_80px_rgba(0,242,254,0.3)]">
            
            {/* Clapperboard Slates Top Bar */}
            <div className="absolute top-0 left-0 right-0 z-20 bg-pitch/90 backdrop-blur-md px-6 py-3 border-b border-white/10 flex items-center justify-between font-mono text-xs">
              <div className="flex items-center gap-3">
                <span className="w-2 h-2 rounded-full bg-recRed animate-rec-blink"></span>
                <span className="font-bold text-white">REEL_2026_MASTER_4K.MOV</span>
              </div>
              <div className="text-white/50 hidden sm:block">
                ACEScc • PRORES 4444 • 24.000 FPS
              </div>
            </div>

            {/* Video Player */}
            <video
              autoPlay
              controls
              playsInline
              className="w-full h-full object-cover pt-10"
              poster="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85"
            >
              <source src="https://assets.mixkit.co/videos/preview/mixkit-fog-over-the-mountain-peaks-42998-large.mp4" type="video/mp4" />
            </video>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: Reel 9:16 Social Player Modal
    // ==========================================
    function ReelModal({ reel, onClose }) {
      if (!reel) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 animate-fadeIn">
          {/* Close Button */}
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/60 hover:text-white p-2.5 rounded-full bg-white/10 hover:bg-white/20 transition-all"
            data-cursor="CLOSE"
          >
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <div className="flex flex-col lg:flex-row items-center gap-6 max-h-[90vh]">
            {/* 9:16 Video Player Container */}
            <div className="relative h-[78vh] aspect-[9/16] rounded-2xl overflow-hidden bg-pitch border border-neonCyan/50 shadow-[0_0_50px_rgba(0,242,254,0.3)]">
              <video
                autoPlay
                loop
                controls
                playsInline
                className="w-full h-full object-cover"
                poster={reel.image}
              >
                <source src={reel.previewVideo} type="video/mp4" />
              </video>
            </div>

            {/* Reel Details & Story Breakdown */}
            <div className="max-w-sm text-left bg-surface/90 p-6 rounded-2xl border border-white/10 font-mono text-xs space-y-4">
              <div className="flex items-center justify-between text-neonCyan font-bold">
                <span>{reel.category}</span>
                <span>{reel.badge}</span>
              </div>
              <h3 className="font-syne font-bold text-xl text-white">
                {reel.title}
              </h3>
              <p className="text-white/60 text-xs leading-relaxed font-inter">
                {reel.tagline}
              </p>
              <div className="pt-2 border-t border-white/10 space-y-2 text-white/50 text-[11px]">
                <div className="flex justify-between">
                  <span>DIRECTOR:</span>
                  <span className="text-white">{reel.director}</span>
                </div>
                <div className="flex justify-between">
                  <span>VIEWS:</span>
                  <span className="text-white">{reel.views}</span>
                </div>
                <div className="flex justify-between">
                  <span>DURATION:</span>
                  <span className="text-white">{reel.duration}</span>
                </div>
                <div className="flex justify-between">
                  <span>ASPECT RATIO:</span>
                  <span className="text-neonCyan">9:16 Vertical Native</span>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-full py-2.5 rounded-lg bg-white/10 hover:bg-neonCyan hover:text-pitch font-bold transition-colors text-white"
              >
                BACK TO GALLERY
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: Scenic Editorial Lightbox Modal
    // ==========================================
    function LightboxModal({ photo, onClose }) {
      if (!photo) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 sm:p-8 animate-fadeIn">
          {/* Close Button */}
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/60 hover:text-white p-2.5 rounded-full bg-white/10 hover:bg-white/20 transition-all"
            data-cursor="CLOSE"
          >
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <div className="relative max-w-6xl w-full max-h-[92vh] flex flex-col items-center">
            {/* Main Image */}
            <div className="relative max-h-[75vh] overflow-hidden rounded-xl border border-white/20 shadow-2xl">
              <img
                src={photo.image}
                alt={photo.title}
                className="max-h-[75vh] w-auto object-contain"
              />
            </div>

            {/* EXIF Metadata Card */}
            <div className="w-full mt-4 p-4 rounded-xl bg-surface/90 border border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4 font-mono text-xs">
              <div>
                <span className="text-neonCyan font-bold mr-2">{photo.number}</span>
                <span className="font-serifExpressive italic text-lg text-white mr-3">{photo.title}</span>
                <span className="text-white/50">{photo.location}</span>
              </div>
              <div className="flex items-center gap-4 text-white/60 text-[11px]">
                <span>{photo.camera}</span>
                <span>•</span>
                <span>{photo.lens}</span>
                <span>•</span>
                <span className="text-neonCyan">{photo.settings}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [showreelOpen, setShowreelOpen] = useState(false);
      const [selectedReel, setSelectedReel] = useState(null);
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [letterboxActive, setLetterboxActive] = useState(false);
      const [audioPlaying, setAudioPlaying] = useState(false);
      const contactRef = useRef(null);

      // Toggle 2.39:1 Anamorphic Scope Letterbox bars
      const handleToggleLetterbox = () => {
        const topBar = document.getElementById('letterbox-top');
        const bottomBar = document.getElementById('letterbox-bottom');
        const nextState = !letterboxActive;
        setLetterboxActive(nextState);
        if (topBar && bottomBar) {
          topBar.style.height = nextState ? '60px' : '0';
          bottomBar.style.height = nextState ? '60px' : '0';
        }
      };

      // Toggle Sound Synthesis
      const handleToggleAudio = () => {
        const newState = audioEngine.toggle();
        setAudioPlaying(newState);
      };

      const handleScrollToContact = () => {
        if (contactRef.current) {
          contactRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleScrollToWork = () => {
        const el = document.getElementById('work');
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div className="min-h-screen relative selection:bg-neonCyan selection:text-pitch">
          {/* Custom Cinema Cursor Reticle */}
          <CustomCursor />

          {/* Navigation & Header */}
          <Header
            onOpenContact={handleScrollToContact}
            onToggleLetterbox={handleToggleLetterbox}
            letterboxActive={letterboxActive}
            audioPlaying={audioPlaying}
            onToggleAudio={handleToggleAudio}
          />

          {/* Main Sections */}
          <main>
            {/* Section 2: Hero Section */}
            <Hero
              onOpenReel={() => setShowreelOpen(true)}
              onScrollToWork={handleScrollToWork}
            />

            {/* Section 3: Selected Work Filter & Vertical 9:16 Masonry Grid */}
            <SelectedWork
              onSelectReel={(reel) => setSelectedReel(reel)}
            />

            {/* Section 4: Travel & Scenic Landscape Gallery */}
            <ScenicGallery
              onSelectPhoto={(photo) => setSelectedPhoto(photo)}
            />

            {/* Section 5: Services & Process Grid */}
            <ServicesProcess />

            {/* Section 6: Let's Collaborate Footer */}
            <CollaborateFooter contactRef={contactRef} />
          </main>

          {/* Modals */}
          <ShowreelModal
            isOpen={showreelOpen}
            onClose={() => setShowreelOpen(false)}
          />

          <ReelModal
            reel={selectedReel}
            onClose={() => setSelectedReel(null)}
          />

          <LightboxModal
            photo={selectedPhoto}
            onClose={() => setSelectedPhoto(null)}
          />
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
