    // --- Cinematic Audio Ambient Synth Engine ---
    class CinematicAudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.filter = null;
        this.gain = null;
        this.isPlaying = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      start() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const now = this.ctx.currentTime;
        this.gain = this.ctx.createGain();
        this.gain.gain.setValueAtTime(0.001, now);
        this.gain.gain.exponentialRampToValueAtTime(0.1, now + 3);

        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(140, now);

        this.osc1 = this.ctx.createOscillator();
        this.osc1.type = 'sawtooth';
        this.osc1.frequency.setValueAtTime(36.71, now); // D1

        this.osc2 = this.ctx.createOscillator();
        this.osc2.type = 'sine';
        this.osc2.frequency.setValueAtTime(55.00, now); // A1

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc1.start();
        this.osc2.start();
        this.isPlaying = true;
      }

      stop() {
        if (!this.isPlaying || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.gain.gain.setValueAtTime(this.gain.gain.value, now);
        this.gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);
        setTimeout(() => {
          if (this.osc1) {
            try { this.osc1.stop(); this.osc2.stop(); } catch(e){}
          }
          this.isPlaying = false;
        }, 1500);
      }

      toggle() {
        if (this.isPlaying) {
          this.stop();
          return false;
        } else {
          this.start();
          return true;
        }
      }
    }

// INDIVIDUAL BTS CARD COMPONENT
// Default: Gritty Monochromatic
// Hover: Instant Full Color + 2-3s Rapid Looping Action Video
// ==========================================
function BTSCard({ item }) {
  const [isHovered, setIsHovered] = useState(false);
  const videoRef = useRef(null);

  useEffect(() => {
    if (videoRef.current) {
      videoRef.current.muted = true;
      videoRef.current.defaultMuted = true;
      videoRef.current.volume = 0;
    }
  }, []);

  const handleMouseEnter = () => {
    setIsHovered(true);
    const video = videoRef.current;
    if (video) {
      video.muted = true;
      try {
        if (video.readyState >= 1) {
          video.currentTime = item.startTime;
        } else {
          video.addEventListener(
            'loadedmetadata',
            () => {
              try {
                video.currentTime = item.startTime;
              } catch (e) {}
            },
            { once: true }
          );
        }
      } catch (e) {}

      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }
    }
  };

  const handleMouseLeave = () => {
    setIsHovered(false);
    if (videoRef.current) {
      videoRef.current.pause();
    }
  };

  const handleTimeUpdate = () => {
    if (videoRef.current) {
      if (videoRef.current.currentTime >= item.endTime || videoRef.current.currentTime < item.startTime - 0.5) {
        videoRef.current.currentTime = item.startTime;
      }
    }
  };

  return (
    <div
      onMouseEnter={handleMouseEnter}
      onMouseLeave={handleMouseLeave}
      onClick={() => setIsHovered((prev) => !prev)}
      className={`group relative overflow-hidden bg-black border border-white/10 ${item.gridSpan} ${item.negativeMargin} transition-all duration-300 hover:z-30 hover:scale-[1.015] hover:border-[#FF6B4A]/90 hover:shadow-[0_25px_60px_rgba(0,0,0,0.95)]`}
      style={{
        cursor: 'none',
      }}
    >
      {/* Container with CSS Filter Transition:
          Default: Intense Moody Monochromatic
          Hover: Transition to Full Raw Color */}
      <div
        className="relative w-full h-full"
        style={{
          filter: isHovered
            ? 'grayscale(0%) contrast(115%) brightness(105%) saturate(125%)'
            : 'grayscale(100%) contrast(165%) brightness(85%)',
          transition: 'filter 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
        }}

  const [submitted, setSubmitted] = useState(false);

  // Resize check
  useEffect(() => {
    const checkMobile = () => {
      setIsMobile(window.innerWidth < 768);
    };
    checkMobile();
    window.addEventListener('resize', checkMobile);
    return () => window.removeEventListener('resize', checkMobile);
  }, []);

  // Scroll-triggered rotation calculation with full responsive travel
  useEffect(() => {
    let animationFrameId;

    const handleScroll = () => {
      if (!sectionRef.current) return;
      const rect = sectionRef.current.getBoundingClientRect();
      const windowHeight = window.innerHeight;

      // Full travel calculation from section entering bottom of viewport to bottom of document
      const maxScrollTravel = Math.max(1, rect.height);
      const currentTravel = windowHeight - rect.top;
      const rawProgress = currentTravel / maxScrollTravel;
      const clamped = Math.min(1, Math.max(0, rawProgress));

      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(() => {
        setScrollProgress(clamped);
      });
    };

    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll();

    return () => {
      window.removeEventListener('scroll', handleScroll);
      cancelAnimationFrame(animationFrameId);
    };
  }, []);

  const handleMouseMove = (e) => {
    if (isMobile) return;
    const norm = (e.clientX / window.innerWidth) - 0.5; // -0.5 to +0.5

                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    placeholder="name@enterprise.com"
                    className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 text-xs sm:text-sm outline-none focus:border-[#FF7A59] focus:ring-1 focus:ring-[#FF7A59] transition-all"
                  />
                </div>

                <div>
                  <label className="block font-mono text-[11px] uppercase tracking-wider text-white/60 mb-1.5">
                    Scope of Production *
                  </label>
                  <select
                    value={formData.scope}
                    onChange={(e) => setFormData({ ...formData, scope: e.target.value })}
                    className="w-full bg-[#141414] border border-white/10 rounded-xl px-4 py-3 text-white text-xs sm:text-sm outline-none focus:border-[#FF7A59] transition-all cursor-pointer"
                  >
                    <option value="Commercial Campaign">Commercial Ad & Brand Anthem</option>
                    <option value="High Altitude Expedition">High Altitude & Drone Expedition</option>
                    <option value="Event & Sports Master">Sports & Arena Event Coverage</option>
                    <option value="9:16 Vertical Retainer">9:16 Kinetic Media Retainer</option>
                  </select>
                </div>

                <div>
                  <label className="block font-mono text-[11px] uppercase tracking-wider text-white/60 mb-1.5">
                    Brief & Vision
                  </label>
                  <textarea
                    rows={3}
                    value={formData.message}
                    onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                    placeholder="Timeline, locations, camera package or deliverables..."
                    className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-white/30 text-xs sm:text-sm outline-none focus:border-[#FF7A59] transition-all resize-none"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-3.5 rounded-full bg-[#FF6B4A] hover:bg-[#FF5530] text-white font-semibold text-xs uppercase tracking-wider transition-all duration-300 shadow-[0_10px_25px_rgba(255,107,74,0.35)] flex items-center justify-center gap-2 mt-2"
                >
                  {isSubmitting ? 'Transmitting...' : 'Send Production Brief ↗'}
                </button>
              </form>
            )}
          </div>
        </div>
      )}

      {/* ========================================== */}
      {/* MODAL: Legal (Privacy Policy / Terms)      */}
      {/* ========================================== */}
      {activeLegalModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/85 backdrop-blur-xl animate-in fade-in duration-300">
          <div
            className="relative w-full max-w-lg bg-[#0e0e0e] border border-white/15 rounded-2xl sm:rounded-3xl p-6 sm:p-8 shadow-2xl text-left font-inter"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={() => setActiveLegalModal(null)}
              className="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition-colors"
            >
              <span>✕</span>
            </button>

            <div className="flex items-center gap-2 font-mono text-xs text-[#FF7A59] uppercase tracking-widest mb-3">
              {activeLegalModal === 'privacy' ? <span>🛡️</span> : <span>📄</span>}
              <span>{activeLegalModal === 'privacy' ? 'Privacy Policy' : 'Terms of Use'}</span>
            </div>

            <h3 className="font-syncopate font-bold text-xl uppercase text-white mb-4">
              {activeLegalModal === 'privacy' ? 'Data & Content Privacy' : 'Production Terms'}
            </h3>

            <div className="space-y-3 text-xs text-white/70 font-light leading-relaxed max-h-60 overflow-y-auto pr-2">
              {activeLegalModal === 'privacy' ? (
                <>
                  <p>
                    FrameMotion Film values your confidentiality. Any project briefs, raw footages, storyboards, or enterprise contact information submitted to us are strictly safeguarded under non-disclosure standards.
                  </p>
                  <p>
                    We do not sell, license, or transmit your contact data to third parties. Information collected is solely utilized to formulate production proposals and communicate deliverables.
                  </p>
                </>
              ) : (
                <>
                  <p>
                    All cinematographic assets, drone aerials, soundscapes, and project masters produced by FrameMotion are licensed subject to individualized commercial production agreements.
                  </p>
                  <p>
                    Safety and regulatory compliance govern all UAV drone operations. High-altitude operations in Spiti and Kinnaur comply with DGCA aviation standards and environmental conservation protocols.
                  </p>
                </>
              )}
            </div>

            <div className="mt-6 pt-4 border-t border-white/10 text-right">
              <button
                onClick={() => setActiveLegalModal(null)}
                className="px-5 py-2 rounded-full bg-white/10 hover:bg-white/20 text-white text-xs font-mono tracking-wider uppercase transition-colors"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      )}
    </footer>
  );
}


    function ReelModal({ reel, onClose }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (reel) {
          document.body.style.overflow = 'hidden';
          window.addEventListener('keydown', handleKeyDown);
        }
        return () => {
          document.body.style.overflow = 'auto';
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [reel, onClose]);

      if (!reel) return null;

      const isVertical = reel.aspectRatio === '9/16' || reel.tag || reel.views;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 sm:p-6">
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/70 hover:text-neonCyan p-3 rounded-full bg-white/10 hover:bg-white/20 transition-all border border-white/15 text-lg"
          >
            ✕
          </button>

          <div className={`flex flex-col ${isVertical ? 'lg:flex-row' : 'w-full max-w-5xl'} items-center gap-6 max-h-[92vh] overflow-y-auto no-scrollbar`}>
            <div className={`relative overflow-hidden rounded-lg bg-charcoal border border-white/20 shadow-[0_0_50px_rgba(0,242,254,0.25)] ${
              isVertical ? 'h-[75vh] aspect-[9/16]' : 'w-full aspect-video'
            }`}>
              <video
                autoPlay
                loop
                controls
                playsInline
                className="w-full h-full object-cover"
                poster={reel.poster || reel.posterUrl}
              >
                <source src={reel.videoUrl} type="video/mp4" />
              </video>
            </div>

            <div className={`text-left bg-charcoal/90 p-6 sm:p-8 rounded-lg border border-white/15 font-mono text-xs space-y-4 backdrop-blur-md ${
              isVertical ? 'max-w-sm w-full' : 'w-full'
            }`}>
              <div className="flex items-center justify-between text-neonCyan font-bold">
                <span className="uppercase tracking-widest">{reel.category || 'FRAMEMOTION CUT'}</span>
                <span>{reel.tag || '4K MASTER'}</span>
              </div>

              <h3 className="font-syncopate font-bold text-xl sm:text-2xl text-white uppercase leading-snug">
                {reel.title}
              </h3>

              <p className="text-white/70 text-xs sm:text-sm leading-relaxed font-inter font-light">
                {reel.description}
              </p>

              <div className="pt-4 border-t border-white/10 space-y-2 text-white/50 text-[11px]">
                {reel.client && (
                  <div className="flex justify-between">
                    <span>CLIENT / PRODUCTION:</span>
                    <span className="text-white">{reel.client}</span>
                  </div>
                )}
                {reel.views && (
                  <div className="flex justify-between">
                    <span>ENGAGEMENT:</span>
                    <span className="text-white">{reel.views} Views • {reel.likes} Likes</span>
                  </div>
                )}
                <div className="flex justify-between">
                  <span>COLOR PROFILE:</span>
                  <span className="text-neonCyan">ARRI LogC4 / Rec.709 Cine</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }


    function ShowreelModal({ isOpen, onClose }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (isOpen) {
          document.body.style.overflow = 'hidden';
          window.addEventListener('keydown', handleKeyDown);
        }
        return () => {
          document.body.style.overflow = 'auto';
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 sm:p-8">
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/70 hover:text-neonCyan p-3 rounded-full bg-white/10 hover:bg-white/20 transition-all border border-white/15 text-lg"
          >
            ✕
          </button>

          <div className="relative w-full max-w-5xl aspect-video bg-charcoal rounded-lg overflow-hidden border border-white/20 shadow-[0_0_80px_rgba(0,242,254,0.3)]">
            <div className="absolute top-0 left-0 right-0 z-20 bg-black/80 backdrop-blur-md px-6 py-3 border-b border-white/10 flex items-center justify-between font-mono text-xs">
              <div className="flex items-center gap-3">
                <span className="w-2 h-2 rounded-full bg-recRed animate-rec-blink"></span>
                <span className="font-bold text-white tracking-widest font-syncopate">FRAMEMOTION_SHOWREEL_4K.MOV</span>
              </div>
              <div className="text-white/50 hidden sm:flex items-center gap-3 font-mono text-[11px]">
                <span>ARRI RAW • 24.000 FPS</span>
                <span className="text-neonCyan">BINAURAL AUDIO</span>
              </div>
            </div>

            <video
              autoPlay
              controls
              playsInline
              className="w-full h-full object-cover pt-10"
              poster="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85"
            >
              <source src="/videos/dtdl%20cricket%20website%20upload.mp4" type="video/mp4" />
              <source src="/videos/hero.mp4" type="video/mp4" />
              <source src="videos/dtdl%20cricket%20website%20upload.mp4" type="video/mp4" />
            </video>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================

    function App() {
      const [showreelOpen, setShowreelOpen] = useState(false);
      const [selectedReel, setSelectedReel] = useState(null);
      const [audioPlaying, setAudioPlaying] = useState(false);
      const contactRef = useRef(null);

      const handleToggleAudio = () => {
        const nextState = audioEngine.toggle();
        setAudioPlaying(nextState);
      };

      const handleScrollToContact = () => {
        if (contactRef.current) {
          contactRef.current.scrollIntoView({ behavior: 'smooth' });
        } else {
          document.querySelector('#contact')?.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleScrollToWork = () => {
        document.querySelector('#work')?.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-black text-white font-inter selection:bg-neonCyan selection:text-black overflow-x-hidden antialiased cinema-grid-bg relative w-full">
          {/* Header */}
          <Navbar
            onOpenContact={handleScrollToContact}
            audioPlaying={audioPlaying}
            onToggleAudio={handleToggleAudio}
          />

          {/* Section 1: The Hero (The Pulse of the Frame) */}
          <Hero
            onOpenReel={() => setShowreelOpen(true)}
            onScrollToWork={handleScrollToWork}
            onStartProduction={handleScrollToContact}
          />

          {/* Section 2: Stories in Motion (The Director's Cut) */}
          <StoriesInMotion
            onSelectProject={(project) => setSelectedReel(project)}
          />

          {/* Section 3: Commercial & Enterprise Client Showcase (3-Row Marquee) */}
          <ClientShowcase />

          {/* Section 4: Behind the Scenes (South Indian Action Cinema Asymmetrical Grid) */}
          <BehindTheScenes />

          {/* Section 5: The Manifesto (The Vision Behind the Flow) */}
          <Manifesto />

          {/* Section 6: The Innovation Lab & Digital Flow */}
          <DigitalFlow
            onSelectReel={(reel) => setSelectedReel(reel)}
          />

          {/* Section 7: The Flow of Capabilities (Marquee) */}
          <CapabilitiesMarquee />

          {/* Section 6: The Footer (Ready to Move Forward?) */}
          <FooterCTA contactRef={contactRef} />

          {/* Modals */}
          <ShowreelModal
            isOpen={showreelOpen}
            onClose={() => setShowreelOpen(false)}
          />

          <ReelModal
            reel={selectedReel}
            onClose={() => setSelectedReel(null)}
          />
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
