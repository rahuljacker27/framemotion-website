    // --- Cinematic Audio Ambient Synth Engine ---
    class CinematicAudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.filter = null;
        this.gain = null;
        this.isPlaying = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      start() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const now = this.ctx.currentTime;
        this.gain = this.ctx.createGain();
        this.gain.gain.setValueAtTime(0.001, now);
        this.gain.gain.exponentialRampToValueAtTime(0.1, now + 3);

        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(140, now);

        this.osc1 = this.ctx.createOscillator();
        this.osc1.type = 'sawtooth';
        this.osc1.frequency.setValueAtTime(36.71, now); // D1

        this.osc2 = this.ctx.createOscillator();
        this.osc2.type = 'sine';
        this.osc2.frequency.setValueAtTime(55.00, now); // A1

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc1.start();
        this.osc2.start();
        this.isPlaying = true;
      }

      stop() {
        if (!this.isPlaying || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.gain.gain.setValueAtTime(this.gain.gain.value, now);
        this.gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);
        setTimeout(() => {
          if (this.osc1) {
            try { this.osc1.stop(); this.osc2.stop(); } catch(e){}
          }
          this.isPlaying = false;
        }, 1500);
      }

      toggle() {
        if (this.isPlaying) {
          this.stop();
          return false;
        } else {
          this.start();
          return true;
        }
      }
    }

              <div className="lg:col-span-6 flex flex-col justify-between h-full space-y-10">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-mono text-white/70 mb-6">
                    <span className="w-2 h-2 rounded-full bg-neonCyan animate-pulse"></span>
                    <span>PRODUCTION INQUIRY // Q4</span>
                  </div>

                  <h2 className="font-syncopate font-bold text-3xl sm:text-5xl lg:text-6xl uppercase tracking-tight text-white leading-[1.1]">
                    Ready to craft the{' '}
                    <span className="text-neonCyan drop-shadow-[0_0_20px_rgba(0,242,254,0.4)]">
                      next frame?
                    </span>{' '}
                    <br className="hidden sm:block" />
                    Let's talk.
                  </h2>

                  <p className="font-inter text-base sm:text-lg text-white/60 font-light mt-6 max-w-lg leading-relaxed">
                    Whether deploying 8K multi-cam crews for international summits or embarking on remote mountain expeditions, our directors translate vision into kinetic momentum.
                  </p>
                </div>

                <div className="space-y-4 pt-6 border-t border-white/10">
                  <div className="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-10 text-xs font-mono text-white/50">
                    <div>
                      <span className="text-white/30 block mb-0.5">DIRECT ENQUIRIES</span>
                      <a href="mailto:hello@framemotion.com" className="text-white hover:text-neonCyan transition-colors">
                        hello@framemotion.com
                      </a>
                    </div>
                    <div>
                      <span className="text-white/30 block mb-0.5">BASE CAMP</span>
                      <span className="text-white">NEW DELHI / SPITI VALLEY</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Right Side: Inquiry Form */}
              <div className="lg:col-span-6 bg-charcoal/80 border border-white/10 rounded-lg sm:rounded-xl p-6 sm:p-10 backdrop-blur-md shadow-2xl">
                {submitted ? (
                  <div className="py-12 flex flex-col items-center justify-center text-center space-y-4">
                    <div className="w-16 h-16 rounded-full bg-neonCyan/10 border border-neonCyan flex items-center justify-center text-neonCyan shadow-[0_0_25px_rgba(0,242,254,0.4)] text-2xl">
                      ✓
                    </div>
                    <h3 className="font-syncopate font-bold text-xl uppercase text-white">
                      Frame Initialized
                    </h3>
                    <p className="font-inter text-sm text-white/70 max-w-sm font-light leading-relaxed">
                      Thank you, <span className="text-white font-medium">{formData.name}</span>. Your brief for <span className="text-neonCyan">{formData.scope}</span> has been logged. Our executive producer will respond within 4 hours.
                    </p>
                    <button
                      onClick={() => {
                        setSubmitted(false);
                        setFormData({ name: '', scope: 'Event Coverage', message: '' });
                      }}
                      className="mt-4 px-6 py-2.5 rounded bg-white/10 hover:bg-white/20 text-white text-xs font-mono tracking-wider uppercase transition-colors"
                    >
                      Send Another Inquiry
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                      <label className="block font-mono text-xs uppercase tracking-wider text-white/70 mb-2">
                        01 // What is your name or enterprise? *
                      </label>
                      <input
                        type="text"
                        required
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        placeholder="e.g. Alex Rivera or Apex Media"
                        className="w-full bg-black/60 border border-white/15 focus:border-neonCyan rounded-md px-4 py-3.5 text-white placeholder-white/25 text-sm font-inter outline-none transition-colors duration-300 focus:ring-1 focus:ring-neonCyan"
                      />
                    </div>

                    <div>
                      <label className="block font-mono text-xs uppercase tracking-wider text-white/70 mb-2">
                        02 // Scope of Project *
                      </label>
                      <div className="relative">
                        <select
                          value={formData.scope}
                          onChange={(e) => setFormData({ ...formData, scope: e.target.value })}
                          className="w-full bg-black/60 border border-white/15 focus:border-neonCyan rounded-md px-4 py-3.5 text-white text-sm font-inter outline-none transition-colors duration-300 focus:ring-1 focus:ring-neonCyan appearance-none cursor-pointer"
                        >
                          <option value="Event Coverage" className="bg-black text-white">Event Coverage</option>
                          <option value="Travel Campaign" className="bg-black text-white">Travel Campaign</option>
                          <option value="AI/Vertical Retainer" className="bg-black text-white">AI/Vertical Retainer</option>
                        </select>
                        <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-white/50 text-xs">
                          ▼
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block font-mono text-xs uppercase tracking-wider text-white/70 mb-2">
                        03 // Project Vision & Details *
                      </label>
                      <textarea
                        required
                        rows={4}
                        value={formData.message}
                        onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                        placeholder="Tell us about the timeline, target locations, deliverables, or brand narrative..."
                        className="w-full bg-black/60 border border-white/15 focus:border-neonCyan rounded-md px-4 py-3 text-white placeholder-white/25 text-sm font-inter outline-none transition-colors duration-300 focus:ring-1 focus:ring-neonCyan resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-4 rounded-md bg-white hover:bg-neonCyan text-black font-semibold text-xs sm:text-sm tracking-widest uppercase transition-all duration-300 hover:shadow-[0_0_25px_rgba(0,242,254,0.45)] flex items-center justify-center gap-2"
                    >
                      {isSubmitting ? (
                        <span className="font-mono text-xs">TRANSMITTING BRIEF...</span>
                      ) : (
                        <>
                          <span>Transmit Brief</span>
                          <span>↗</span>
                        </>
                      )}
                    </button>
                  </form>
                )}
              </div>

            </div>

            {/* Bottom line: Copyright, Social Links, Small time-stamp graphic */}
            <div className="mt-20 pt-8 border-t border-white/10 flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="font-mono text-xs text-white/40 tracking-wider">
                © Framemotion. All rights reserved.
              </div>

              <div className="flex items-center space-x-6">
                <a
                  href="https://instagram.com"
                  target="_blank"
                  rel="noreferrer"
                  className="font-mono text-xs uppercase tracking-wider text-white/60 hover:text-neonCyan transition-colors"
                >
                  Instagram
                </a>
                <a
                  href="https://linkedin.com"
                  target="_blank"
                  rel="noreferrer"
                  className="font-mono text-xs uppercase tracking-wider text-white/60 hover:text-neonCyan transition-colors"
                >
                  LinkedIn
                </a>
                <a
                  href="https://vimeo.com"
                  target="_blank"
                  rel="noreferrer"
                  className="font-mono text-xs uppercase tracking-wider text-white/60 hover:text-neonCyan transition-colors"
                >
                  Vimeo
                </a>
              </div>

              <div className="flex items-center gap-2 px-3 py-1.5 rounded bg-charcoal border border-white/10 font-mono text-[11px] text-white/60">
                <span className="text-white/40">{timeUtc}</span>
                <span className="text-white/20">|</span>
                <span className="text-neonCyan">{timeIst}</span>
                <span className="w-1.5 h-1.5 rounded-full bg-neonCyan animate-ping ml-1"></span>
              </div>
            </div>

          </div>
        </footer>
      );
    }

    // ==========================================
    // MODALS: ReelModal & ShowreelModal
    // ==========================================
    function ReelModal({ reel, onClose }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (reel) {
          document.body.style.overflow = 'hidden';
          window.addEventListener('keydown', handleKeyDown);
        }
        return () => {
          document.body.style.overflow = 'auto';
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [reel, onClose]);

      if (!reel) return null;

      const isVertical = reel.aspectRatio === '9/16' || reel.tag || reel.views;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 sm:p-6">
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/70 hover:text-neonCyan p-3 rounded-full bg-white/10 hover:bg-white/20 transition-all border border-white/15 text-lg"
          >
            ✕
          </button>

          <div className={`flex flex-col ${isVertical ? 'lg:flex-row' : 'w-full max-w-5xl'} items-center gap-6 max-h-[92vh] overflow-y-auto no-scrollbar`}>
            <div className={`relative overflow-hidden rounded-lg bg-charcoal border border-white/20 shadow-[0_0_50px_rgba(0,242,254,0.25)] ${
              isVertical ? 'h-[75vh] aspect-[9/16]' : 'w-full aspect-video'
            }`}>
              <video
                autoPlay
                loop
                controls
                playsInline
                className="w-full h-full object-cover"
                poster={reel.poster || reel.posterUrl}
              >
                <source src={reel.videoUrl} type="video/mp4" />
              </video>
            </div>

            <div className={`text-left bg-charcoal/90 p-6 sm:p-8 rounded-lg border border-white/15 font-mono text-xs space-y-4 backdrop-blur-md ${
              isVertical ? 'max-w-sm w-full' : 'w-full'
            }`}>
              <div className="flex items-center justify-between text-neonCyan font-bold">
                <span className="uppercase tracking-widest">{reel.category || 'FRAMEMOTION CUT'}</span>
                <span>{reel.tag || '4K MASTER'}</span>
              </div>

              <h3 className="font-syncopate font-bold text-xl sm:text-2xl text-white uppercase leading-snug">
                {reel.title}
              </h3>

              <p className="text-white/70 text-xs sm:text-sm leading-relaxed font-inter font-light">
                {reel.description}
              </p>

              <div className="pt-4 border-t border-white/10 space-y-2 text-white/50 text-[11px]">
                {reel.client && (
                  <div className="flex justify-between">
                    <span>CLIENT / PRODUCTION:</span>
                    <span className="text-white">{reel.client}</span>
                  </div>
                )}
                {reel.views && (
                  <div className="flex justify-between">
                    <span>ENGAGEMENT:</span>
                    <span className="text-white">{reel.views} Views • {reel.likes} Likes</span>
                  </div>
                )}
                <div className="flex justify-between">
                  <span>COLOR PROFILE:</span>
                  <span className="text-neonCyan">ARRI LogC4 / Rec.709 Cine</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ShowreelModal({ isOpen, onClose }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        if (isOpen) {
          document.body.style.overflow = 'hidden';
          window.addEventListener('keydown', handleKeyDown);
        }
        return () => {
          document.body.style.overflow = 'auto';
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-2xl p-4 sm:p-8">
          <button
            onClick={onClose}
            className="absolute top-6 right-6 z-50 text-white/70 hover:text-neonCyan p-3 rounded-full bg-white/10 hover:bg-white/20 transition-all border border-white/15 text-lg"
          >
            ✕
          </button>

          <div className="relative w-full max-w-5xl aspect-video bg-charcoal rounded-lg overflow-hidden border border-white/20 shadow-[0_0_80px_rgba(0,242,254,0.3)]">
            <div className="absolute top-0 left-0 right-0 z-20 bg-black/80 backdrop-blur-md px-6 py-3 border-b border-white/10 flex items-center justify-between font-mono text-xs">
              <div className="flex items-center gap-3">
                <span className="w-2 h-2 rounded-full bg-recRed animate-rec-blink"></span>
                <span className="font-bold text-white tracking-widest font-syncopate">FRAMEMOTION_SHOWREEL_4K.MOV</span>
              </div>
              <div className="text-white/50 hidden sm:flex items-center gap-3 font-mono text-[11px]">
                <span>ARRI RAW • 24.000 FPS</span>
                <span className="text-neonCyan">BINAURAL AUDIO</span>
              </div>
            </div>

            <video
              autoPlay
              controls
              playsInline
              className="w-full h-full object-cover pt-10"
              poster="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85"
            >
              <source src="https://assets.mixkit.co/videos/preview/mixkit-fog-over-the-mountain-peaks-42998-large.mp4" type="video/mp4" />
              <source src="https://cdn.coverr.co/videos/coverr-mist-in-the-mountains-2746/1080p.mp4" type="video/mp4" />
            </video>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [showreelOpen, setShowreelOpen] = useState(false);
      const [selectedReel, setSelectedReel] = useState(null);
      const [audioPlaying, setAudioPlaying] = useState(false);
      const contactRef = useRef(null);

      const handleToggleAudio = () => {
        const nextState = audioEngine.toggle();
        setAudioPlaying(nextState);
      };

      const handleScrollToContact = () => {
        if (contactRef.current) {
          contactRef.current.scrollIntoView({ behavior: 'smooth' });
        } else {
          document.querySelector('#contact')?.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleScrollToWork = () => {
        document.querySelector('#work')?.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-black text-white font-inter selection:bg-neonCyan selection:text-black overflow-x-hidden antialiased cinema-grid-bg relative w-full">
          {/* Header */}
          <Navbar
            onOpenContact={handleScrollToContact}
            audioPlaying={audioPlaying}
            onToggleAudio={handleToggleAudio}
          />

          {/* Section 1: The Hero (The Pulse of the Frame) */}
          <Hero
            onOpenReel={() => setShowreelOpen(true)}
            onScrollToWork={handleScrollToWork}
            onStartProduction={handleScrollToContact}
          />

          {/* Section 2: Stories in Motion (The Director's Cut) */}
          <StoriesInMotion
            onSelectProject={(project) => setSelectedReel(project)}
          />

          {/* Section 3: The Manifesto (The Vision Behind the Flow) */}
          <Manifesto />

          {/* Section 4: The Innovation Lab & Digital Flow */}
          <DigitalFlow
            onSelectReel={(reel) => setSelectedReel(reel)}
          />

          {/* Section 5: The Flow of Capabilities (Marquee) */}
          <CapabilitiesMarquee />

          {/* Section 6: The Footer (Ready to Move Forward?) */}
          <FooterCTA contactRef={contactRef} />

          {/* Modals */}
          <ShowreelModal
            isOpen={showreelOpen}
            onClose={() => setShowreelOpen(false)}
          />

          <ReelModal
            reel={selectedReel}
            onClose={() => setSelectedReel(null)}
          />
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
